<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Icône de l'application (visage de KONAN) : onglet, écran d'accueil iPhone et Android -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/konan-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/konan-favicon-16.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/konan-favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#091427" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KONAN" />
    <meta name="application-name" content="KONAN" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>KONAN - Anti-Burnout | Générateur Intelligent de Planning d'Étude</title>
    <meta name="description" content="Transformez votre emploi du temps universitaire en un planning d'étude personnalisé, réaliste et anti-burnout grâce à l'intelligence artificielle." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Police arrondie de l'écran d'ouverture : seulement les lettres K, O, N, A (fichier minuscule) -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&text=KONA&display=block" rel="stylesheet">
    <style>
      /* Écran d'ouverture : après le visage (écran du téléphone), « KONAN » sur le même bleu ciel */
      #konan-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        background: #90D8F8;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.28s ease;
      }
      #konan-splash.is-hiding { opacity: 0; pointer-events: none; }
      #konan-splash-word {
        font-family: 'Nunito', 'Arial Rounded MT Bold', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: clamp(44px, 14vw, 84px);
        letter-spacing: 0.04em;
        color: #ffffff;
        text-shadow: 0 3px 0 rgba(30, 120, 170, 0.35);
        animation: konan-splash-in 0.45s cubic-bezier(.2,.9,.3,1.25) both;
      }
      @keyframes konan-splash-in { from { transform: scale(0.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #konan-splash-word { animation: none; } }
    </style>
  </head>
  <body class="bg-[#090D16] text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="konan-splash" aria-hidden="true"><div id="konan-splash-word">KONAN</div></div>
    <script>
      // Barre du haut en bleu ciel pendant l'écran d'ouverture ; l'appli retire l'écran dès qu'elle est prête
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) { meta.setAttribute('data-app-color', meta.getAttribute('content') || '#091427'); meta.setAttribute('content', '#90D8F8'); }
        var MIN_MS = 1100; // durée minimale pour que « KONAN » se voie
        var done = false;
        window.__konanHideSplash = function () {
          if (done) return;
          done = true;
          var wait = Math.max(0, MIN_MS - (performance.now ? performance.now() : MIN_MS));
          setTimeout(function () {
            var el = document.getElementById('konan-splash');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', m.getAttribute('data-app-color') || '#091427');
            if (!el) return;
            el.classList.add('is-hiding');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
          }, wait);
        };
        // Sécurité : jamais bloqué sur l'écran d'ouverture
        setTimeout(window.__konanHideSplash, 7000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
